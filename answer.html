<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Model Answer - QCAB</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Markdown Parser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<style>
  :root {
    /* Light Theme Palette */
    --accent-primary: #881337;
    --accent-gradient: linear-gradient(135deg, #881337 0%, #be123c 50%, #e11d48 100%);
    --bg-main: #f8fafc;
    --surface-card: #ffffff;
    --surface-border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --heading-color: #881337;
    --heading-border: #fce7ec;
    --quote-bg: #fdf2f4;
    --table-header-bg: #fdf2f4;
    --btn-bg: #f1f5f9;
    --btn-text: #334155;
    --btn-border: #cbd5e1;
  }

  [data-theme="dark"] {
    /* High-contrast Dark Theme Palette */
    --accent-primary: #fb7185;
    --accent-gradient: linear-gradient(135deg, #4c0519 0%, #881337 50%, #be123c 100%);
    --bg-main: #0f172a;
    --surface-card: #1e293b;
    --surface-border: #334155;
    --text-main: #f1f5f9;
    --text-muted: #94a3b8;
    --heading-color: #f43f5e;
    --heading-border: #4c0519;
    --quote-bg: #2d121c;
    --table-header-bg: #2d121c;
    --btn-bg: #334155;
    --btn-text: #f8fafc;
    --btn-border: #475569;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    line-height: 1.7;
    padding-bottom: 60px;
    transition: background-color 0.3s ease, color 0.3s ease;
  }
  
  header {
    background: var(--accent-gradient);
    color: #fff;
    padding: 32px 20px 40px;
    position: relative;
  }
  .header-content {
    max-width: 900px;
    margin: 0 auto;
    padding-right: 60px; /* Space for mode toggle button */
  }
  header .eyebrow {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.9;
    font-weight: 600;
    margin-bottom: 8px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    font-weight: 700;
  }
  .meta-tag {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    margin-top: 10px;
  }
  
  /* Mode Toggle Switch */
  .theme-toggle {
    position: absolute;
    top: 24px;
    right: 20px;
    background: rgba(255, 255, 255, 0.2);
    border: 1px solid rgba(255, 255, 255, 0.4);
    color: #fff;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(4px);
    transition: background 0.2s ease;
  }
  .theme-toggle:hover {
    background: rgba(255, 255, 255, 0.35);
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .card {
    background: var(--surface-card);
    border: 1px solid var(--surface-border);
    border-radius: 16px;
    padding: 32px;
    margin-top: -24px;
    box-shadow: 0 12px 30px -14px rgba(0,0,0,0.3);
    transition: background-color 0.3s ease, border-color 0.3s ease;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-style: italic;
    padding: 30px 0;
  }
  .spinner {
    width: 18px; height: 18px;
    border: 3px solid var(--surface-border);
    border-top-color: var(--accent-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Markdown Content Formatting */
  #content h1, #content h2, #content h3, #content h4 {
    color: var(--heading-color);
    font-weight: 800;
    margin-top: 28px;
    margin-bottom: 10px;
    border-bottom: 2px solid var(--heading-border);
    padding-bottom: 6px;
  }
  #content strong { 
    color: var(--heading-color); 
    font-weight: 700;
  }
  #content p {
    color: var(--text-main);
  }
  #content ul, #content ol { 
    padding-left: 22px; 
    margin: 10px 0; 
    color: var(--text-main);
  }
  #content li {
    margin-bottom: 6px;
  }
  #content blockquote {
    border-left: 4px solid var(--heading-color);
    background: var(--quote-bg);
    color: var(--text-main);
    margin: 14px 0;
    padding: 10px 16px;
    border-radius: 0 8px 8px 0;
  }
  #content table {
    border-collapse: collapse;
    width: 100%;
    margin: 14px 0;
  }
  #content th, #content td {
    border: 1px solid var(--surface-border);
    padding: 8px 12px;
    color: var(--text-main);
  }
  #content th { 
    background: var(--table-header-bg); 
    color: var(--heading-color); 
  }
  #content code {
    background: var(--bg-main);
    color: var(--accent-primary);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
  }

  .error-box {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #f87171;
    padding: 16px 20px;
    border-radius: 10px;
  }
  
  .print-btn {
    display: inline-block;
    margin-top: 26px;
    background: var(--accent-gradient);
    color: #fff;
    border: none;
    padding: 10px 22px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }

  @media print {
    header, .print-btn, .theme-toggle { display: none; }
    body { background: #fff; color: #000; }
    .card { box-shadow: none; margin-top: 0; border: none; background: #fff; }
    #content h1, #content h2, #content h3, #content h4, #content strong { color: #881337; }
  }
</style>
</head>
<body>

  <header>
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙 Dark</button>
    <div class="header-content">
      <div class="eyebrow">✨ AI Model Answer</div>
      <h1 id="q-title">Loading Question...</h1>
      <div id="q-meta" class="meta-tag" style="display:none;"></div>
    </div>
  </header>

  <div class="wrap">
    <div class="card">
      <div id="status" class="status">
        <span class="spinner"></span> Synthesizing model answer via Gemini...
      </div>
      <div id="content"></div>
      <button id="print-btn" class="print-btn" style="display:none;" onclick="window.print()">🖨 Print / Save as PDF</button>
    </div>
  </div>

  <script>
    const AI_PROXY_URL = "https://qcabproxy.khokcha9.workers.dev/";

    // --- Dark Mode Logic ---
    const themeBtn = document.getElementById('theme-btn');
    
    // Load saved theme preference or default to light
    const currentTheme = localStorage.getItem('qcab_theme') || 'light';
    if (currentTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      themeBtn.textContent = '☀️ Light';
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('qcab_theme', 'light');
        themeBtn.textContent = '🌙 Dark';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('qcab_theme', 'dark');
        themeBtn.textContent = '☀️ Light';
      }
    }

    // --- URL Parsing & Answer Fetching Logic ---
    const urlParams = new URLSearchParams(window.location.search);
    const questionText = urlParams.get('q');
    const yearText = urlParams.get('y');
    const marksText = urlParams.get('m');

    const titleEl = document.getElementById('q-title');
    const metaEl = document.getElementById('q-meta');
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const printBtn = document.getElementById('print-btn');

    if (!questionText) {
      statusEl.style.display = 'none';
      contentEl.innerHTML = `<div class="error-box">❌ No question provided in the URL.</div>`;
    } else {
      titleEl.textContent = questionText;
      
      if (marksText || yearText) {
        metaEl.style.display = 'inline-block';
        metaEl.textContent = `${marksText ? marksText : ''} ${yearText ? '/ ' + yearText : ''}`.trim();
      }

      fetchAnswer();
    }

    async function fetchAnswer() {
      try {
        const res = await fetch(AI_PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: questionText })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data?.error || `Request failed (${res.status})`);
        }

        statusEl.style.display = 'none';
        contentEl.innerHTML = window.marked ? marked.parse(data.text || 'No response text.') : data.text;
        printBtn.style.display = 'inline-block';

      } catch (err) {
  console.error(err);
  if (err.message.includes('Quota exceeded')) {
    statusEl.style.display = 'block';
    statusEl.innerHTML = `<span class="spinner"></span> Rate limit reached. Auto-retrying in 12 seconds...`;
    setTimeout(() => {
      fetchAnswer();
    }, 12000); // Retries after 12 seconds
  } else {
    statusEl.style.display = 'none';
    contentEl.innerHTML = `<div class="error-box">❌ Error generating answer: ${err.message}</div>`;
  }
    }
  </script>
</body>
</html>
