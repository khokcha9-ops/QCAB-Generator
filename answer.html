<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Answer Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Georgia:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f7fc;
      --surface: #ffffff;
      --surface-2: #eef2f9;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --border-strong: #94a3b8;
      --primary: #7c3aed;
      --primary-soft: #f3e8ff;
      --accent: #0891b2;
      --accent-soft: #cffafe;
      --highlight: #f59e0b;
      --danger: #b91c1c;
      --shadow: 0 12px 35px rgba(0,0,0,0.05);
      --radius: 18px;
      --sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --serif: Georgia, 'Times New Roman', serif;
    }
    [data-theme="dark"] {
      --bg: #07090e;
      --surface: #111622;
      --surface-2: #1a2234;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #2a364f;
      --border-strong: #3b4d71;
      --primary: #a78bfa;
      --primary-soft: #2e1065;
      --accent: #22d3ee;
      --accent-soft: #083344;
      --highlight: #fbbf24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      transition: background 0.25s ease, color 0.25s ease;
      padding: 30px 20px;
      max-width: 960px;
      margin: 0 auto;
      line-height: 1.6;
    }
    .container {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 32px 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: background 0.25s ease, border-color 0.25s ease;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .top-bar h2 { font-size: 22px; font-weight: 800; margin: 0; }
    .top-bar-actions { display: flex; gap: 10px; }
    .top-bar-actions button {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }
    .top-bar-actions button:hover {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }
    .question-box {
      background: var(--surface-2);
      border-left: 4px solid var(--primary);
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 24px;
    }
    .question-box .q-text { font-weight: 700; font-size: 18px; line-height: 1.4; }
    .question-box .q-meta { margin-top: 6px; font-size: 14px; color: var(--muted); font-weight: 500; }
    .question-box .q-meta span {
      background: var(--primary-soft);
      color: var(--primary);
      padding: 2px 10px;
      border-radius: 999px;
      margin-right: 8px;
      font-size: 12px;
    }
    .answer-box {
      background: var(--surface-2);
      border-radius: 12px;
      padding: 20px 24px;
      border: 1px solid var(--border);
      font-family: var(--serif);
      line-height: 1.8;
      white-space: pre-wrap;
      min-height: 300px;
      margin-bottom: 20px;
      transition: background 0.25s ease;
      font-size: 16px;
    }
    .answer-box .loading { color: var(--muted); font-style: italic; font-family: var(--sans); }
    .answer-box .kw-term { font-weight: 700; color: var(--primary); }
    .answer-box .kw-example { font-style: italic; color: var(--accent); }
    .answer-box .kw-meta {
      font-size: 0.9em;
      background: #fef3c7;
      padding: 0 4px;
      border-radius: 4px;
      color: #92400e;
      font-weight: 500;
    }
    [data-theme="dark"] .answer-box .kw-meta { background: #451a03; color: #fde68a; }
    .answer-box .kw-highlight {
      background: #fbbf24;
      padding: 0 4px;
      border-radius: 4px;
      color: #0f172a;
      font-weight: 600;
    }
    [data-theme="dark"] .answer-box .kw-highlight { background: #f59e0b; color: #000; }
    .answer-box h1, .answer-box h2, .answer-box h3 {
      font-weight: 700;
      margin: 1.2em 0 0.6em;
      font-family: var(--sans);
    }
    .answer-box h1 { font-size: 1.4em; }
    .answer-box h2 { font-size: 1.2em; }
    .answer-box h3 { font-size: 1.1em; }

    .prompt-area {
      background: #fef9e7;
      border: 1px solid var(--highlight);
      border-radius: 12px;
      padding: 18px 20px;
      margin: 16px 0;
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.7;
      max-height: 400px;
      overflow-y: auto;
      color: var(--text);
      background: var(--surface-2);
    }
    [data-theme="dark"] .prompt-area { background: #1e1b2e; border-color: var(--primary); }
    .prompt-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 12px 0 20px;
    }
    .prompt-actions .btn {
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover, #6d28d9); transform: scale(1.02); }
    .btn-secondary { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:hover { background: var(--border); }
    .btn-success { background: #10b981; color: #fff; }
    .btn-success:hover { background: #059669; transform: scale(1.02); }
    .btn-model {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-model:hover { transform: scale(1.05); border-color: var(--primary); }
    .btn-model.perplexity { background: #8B5CF6; color: #fff; border-color: #8B5CF6; }
    .btn-model.chatgpt { background: #10A37F; color: #fff; border-color: #10A37F; }
    .btn-model.deepseek { background: #2563EB; color: #fff; border-color: #2563EB; }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    @media (max-width: 600px) {
      body { padding: 16px 10px; }
      .container { padding: 20px 16px; }
      .top-bar { flex-direction: column; align-items: flex-start; }
      .top-bar h2 { font-size: 18px; }
      .question-box .q-text { font-size: 16px; }
      .answer-box { font-size: 15px; padding: 16px; }
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <div class="top-bar">
    <h2 id="pageTitle">🤖 AI Model Answer</h2>
    <div class="top-bar-actions">
      <button id="themeToggle">🌙 Dark Mode</button>
      <button onclick="window.close()">✕ Close</button>
    </div>
  </div>
  <div class="question-box" id="questionBox">
    <div class="q-text" id="questionText">Loading question...</div>
    <div class="q-meta" id="questionMeta"></div>
  </div>
  <div id="answerContainer">
    <div class="answer-box" id="answerDisplay"><span class="loading">⏳ Generating answer...</span></div>
    <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;">
      <button class="btn btn-secondary" id="regenerateBtn" style="display:none;">🔄 Regenerate</button>
      <button class="btn btn-secondary" id="copyAnswerBtn" style="display:none;">📋 Copy Answer</button>
    </div>
  </div>
  <div id="promptContainer" style="display:none;">
    <div class="prompt-area" id="promptContent"></div>
    <div class="prompt-actions">
      <button class="btn btn-secondary" id="copyPromptBtn">📄 Copy Prompt</button>
      <button class="btn-model perplexity" id="openPerplexity">🌀 Perplexity</button>
      <button class="btn-model chatgpt" id="openChatGPT">💬 ChatGPT</button>
      <button class="btn-model deepseek" id="openDeepSeek">🔬 DeepSeek</button>
    </div>
    <p style="font-size:13px; color:var(--muted); margin-top:8px;">
      Click a model button to open the AI website with the question pre‑filled. 
      Then press Enter to generate the answer.
    </p>
  </div>
  <div class="footer">Powered by your AI Worker</div>
</div>

<script>
  // ============================================================
  // THEME
  // ============================================================
  function getPreferredTheme() {
    return localStorage.getItem('qcab_theme') ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  }
  function applyTheme(theme) {
    const isDark = theme === 'dark';
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : '');
    localStorage.setItem('qcab_theme', theme);
    const btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
  }
  const initialTheme = getPreferredTheme();
  applyTheme(initialTheme);
  document.getElementById('themeToggle')?.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    applyTheme(current === 'dark' ? 'light' : 'dark');
  });

  // ============================================================
  // PARSE URL
  // ============================================================
  const params = new URLSearchParams(window.location.search);
  const question = decodeURIComponent(params.get('q') || '');
  const year = decodeURIComponent(params.get('y') || '');
  const marks = decodeURIComponent(params.get('m') || '');
  const model = decodeURIComponent(params.get('model') || 'secret');
  const mode = decodeURIComponent(params.get('mode') || 'internal');

  const questionText = document.getElementById('questionText');
  const questionMeta = document.getElementById('questionMeta');
  const answerDisplay = document.getElementById('answerDisplay');
  const regenerateBtn = document.getElementById('regenerateBtn');
  const copyAnswerBtn = document.getElementById('copyAnswerBtn');
  const promptContainer = document.getElementById('promptContainer');
  const promptContent = document.getElementById('promptContent');
  const copyPromptBtn = document.getElementById('copyPromptBtn');
  const pageTitle = document.getElementById('pageTitle');

  let metaParts = [];
  if (year) metaParts.push(`📅 ${year}`);
  if (marks) metaParts.push(`📝 ${marks} Marks`);
  questionText.textContent = question || 'Question not provided';
  if (metaParts.length) {
    questionMeta.innerHTML = metaParts.map(p => `<span>${p}</span>`).join(' ');
  }

  // ============================================================
  // INTERNAL
  // ============================================================
  async function generateInternal() {
    const userToken = localStorage.getItem('userToken') || localStorage.getItem('qcab_owner_key');
    if (!userToken) {
      answerDisplay.innerHTML = '❌ Please login first. <a href="#" onclick="window.location.href=\'./login.html\'">Login</a>';
      return;
    }
    try {
      const res = await fetch(`https://qcap-ai-v2.khokcha9.workers.dev/api/generate-answer?question=${encodeURIComponent(question)}`, {
        headers: { 'Authorization': 'Bearer ' + userToken }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to generate');
      let html = data.text.replace(/\n/g, '<br>');
      answerDisplay.innerHTML = html;
      regenerateBtn.style.display = 'inline-block';
      copyAnswerBtn.style.display = 'inline-block';
    } catch (err) {
      answerDisplay.innerHTML = `❌ Error: ${err.message}`;
    }
  }

  copyAnswerBtn?.addEventListener('click', () => {
    const text = answerDisplay.innerText;
    navigator.clipboard.writeText(text).then(() => alert('Answer copied!')).catch(() => alert('Failed to copy.'));
  });
  regenerateBtn?.addEventListener('click', generateInternal);

  // ============================================================
  // EXTERNAL
  // ============================================================
  function showExternalPrompt() {
    const modelName = model.charAt(0).toUpperCase() + model.slice(1);
    const prompt = `You are an expert UPSC Civil Services model answer writer. Generate a high-quality, comprehensive answer of approximately 500–600 words for the following question:

"${question}"

Instructions:
- Provide a well-structured answer with introduction, main body (with subheadings if needed), and conclusion.
- Use relevant facts, examples, and recent developments (up to ${new Date().toLocaleDateString()}).
- Write in a formal, academic style suitable for the UPSC Mains examination.
- Ensure the answer is balanced and covers all dimensions of the question.

Please generate the answer now.`;

    pageTitle.textContent = `🤖 ${modelName} AI – Ready Prompt`;
    document.getElementById('answerContainer').style.display = 'none';
    promptContainer.style.display = 'block';
    promptContent.textContent = prompt;

    copyPromptBtn?.addEventListener('click', () => {
      navigator.clipboard.writeText(prompt).then(() => alert('Prompt copied!')).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = prompt;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        textarea.remove();
        alert('Prompt copied!');
      });
    });

    const encodedPrompt = encodeURIComponent(prompt);
    document.getElementById('openPerplexity')?.addEventListener('click', () => {
      window.open(`https://www.perplexity.ai/search?q=${encodeURIComponent(question)}`, '_blank');
    });
    document.getElementById('openChatGPT')?.addEventListener('click', () => {
      window.open(`https://chat.openai.com/?q=${encodedPrompt}`, '_blank');
    });
    document.getElementById('openDeepSeek')?.addEventListener('click', () => {
      window.open(`https://chat.deepseek.com/?q=${encodedPrompt}`, '_blank');
    });
  }

  // ============================================================
  // START
  // ============================================================
  if (mode === 'external' || model !== 'secret') {
    showExternalPrompt();
  } else {
    generateInternal();
  }
</script>
</body>
</html>
