<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Model Answer - QCAB</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Markdown Parser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
<style>
  :root {
    --accent-primary: #881337;
    --accent-gradient: linear-gradient(135deg, #881337 0%, #be123c 50%, #e11d48 100%);
    --bg-main: #f8fafc;
    --surface-card: #ffffff;
    --surface-border: #e2e8f0;
    --text-main: #0f172a;
    --text-muted: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-main);
    color: var(--text-main);
    line-height: 1.7;
    padding-bottom: 60px;
  }
  header {
    background: var(--accent-gradient);
    color: #fff;
    padding: 32px 20px 40px;
  }
  header .eyebrow {
    font-size: 12px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    opacity: 0.85;
    font-weight: 600;
    margin-bottom: 8px;
  }
  header h1 {
    font-size: 20px;
    margin: 0;
    font-weight: 700;
    max-width: 900px;
  }
  .meta-tag {
    display: inline-block;
    background: rgba(255,255,255,0.2);
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    margin-top: 10px;
  }
  .wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .card {
    background: var(--surface-card);
    border: 1px solid var(--surface-border);
    border-radius: 16px;
    padding: 32px;
    margin-top: -24px;
    box-shadow: 0 12px 30px -14px rgba(0,0,0,0.12);
  }
  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-style: italic;
    padding: 30px 0;
  }
  .spinner {
    width: 18px; height: 18px;
    border: 3px solid #e2e8f0;
    border-top-color: var(--accent-primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #content h1, #content h2, #content h3, #content h4 {
    color: var(--accent-primary);
    font-weight: 800;
    margin-top: 28px;
    margin-bottom: 10px;
    border-bottom: 2px solid #fce7ec;
    padding-bottom: 6px;
  }
  #content strong { color: var(--accent-primary); }
  #content ul, #content ol { padding-left: 22px; margin: 10px 0; }
  #content blockquote {
    border-left: 4px solid var(--accent-primary);
    background: #fdf2f4;
    margin: 14px 0;
    padding: 10px 16px;
    border-radius: 0 8px 8px 0;
  }
  #content table {
    border-collapse: collapse;
    width: 100%;
    margin: 14px 0;
  }
  #content th, #content td {
    border: 1px solid var(--surface-border);
    padding: 8px 12px;
  }
  #content th { background: #fdf2f4; color: var(--accent-primary); }
  .error-box {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    padding: 16px 20px;
    border-radius: 10px;
  }
  .print-btn {
    display: inline-block;
    margin-top: 26px;
    background: var(--accent-gradient);
    color: #fff;
    border: none;
    padding: 10px 22px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
  @media print {
    header, .print-btn { display: none; }
    .card { box-shadow: none; margin-top: 0; border: none; }
  }
</style>
</head>
<body>

  <header>
    <div class="eyebrow">✨ AI Model Answer</div>
    <h1 id="q-title">Loading Question...</h1>
    <div id="q-meta" class="meta-tag" style="display:none;"></div>
  </header>

  <div class="wrap">
    <div class="card">
      <div id="status" class="status">
        <span class="spinner"></span> Synthesizing model answer via Gemini...
      </div>
      <div id="content"></div>
      <button id="print-btn" class="print-btn" style="display:none;" onclick="window.print()">🖨 Print / Save as PDF</button>
    </div>
  </div>

  <script>
    const AI_PROXY_URL = "https://qcabproxy.khokcha9.workers.dev/";

    // 1. Parse Query Parameters from URL
    const urlParams = new URLSearchParams(window.location.search);
    const questionText = urlParams.get('q');
    const yearText = urlParams.get('y');
    const marksText = urlParams.get('m');

    const titleEl = document.getElementById('q-title');
    const metaEl = document.getElementById('q-meta');
    const statusEl = document.getElementById('status');
    const contentEl = document.getElementById('content');
    const printBtn = document.getElementById('print-btn');

    if (!questionText) {
      statusEl.style.display = 'none';
      contentEl.innerHTML = `<div class="error-box">❌ No question provided in the URL.</div>`;
    } else {
      titleEl.textContent = questionText;
      
      if (marksText || yearText) {
        metaEl.style.display = 'inline-block';
        metaEl.textContent = `${marksText ? marksText : ''} ${yearText ? '/ ' + yearText : ''}`.trim();
      }

      // 2. Fetch Model Answer from Worker Proxy
      fetchAnswer();
    }

    async function fetchAnswer() {
      try {
        const res = await fetch(AI_PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: questionText })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data?.error || `Request failed (${res.status})`);
        }

        statusEl.style.display = 'none';
        contentEl.innerHTML = window.marked ? marked.parse(data.text || 'No response text.') : data.text;
        printBtn.style.display = 'inline-block';

      } catch (err) {
        console.error(err);
        statusEl.style.display = 'none';
        contentEl.innerHTML = `<div class="error-box">❌ Error generating answer: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
