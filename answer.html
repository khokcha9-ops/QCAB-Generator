<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Answer Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #f4f7fc;
    color: #0f172a;
    padding: 40px 20px;
    max-width: 900px;
    margin: 0 auto;
  }
  .container { background: #fff; border-radius: 20px; padding: 30px; box-shadow: 0 12px 35px rgba(0,0,0,0.05); }
  .question { font-size: 18px; font-weight: 700; margin-bottom: 20px; padding: 16px; background: #f8fafc; border-radius: 12px; border-left: 4px solid #7c3aed; }
  .answer-box {
    background: #f1f5f9;
    border-radius: 12px;
    padding: 20px;
    white-space: pre-wrap;
    font-family: 'Georgia', serif;
    line-height: 1.7;
    min-height: 300px;
    border: 1px solid #e2e8f0;
    margin-bottom: 20px;
  }
  .loading { color: #475569; font-style: italic; }
  .btn {
    border: none;
    background: #7c3aed;
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    font-size: 14px;
  }
  .btn:hover { background: #6d28d9; transform: scale(1.02); }
  .btn-secondary { background: #e2e8f0; color: #0f172a; }
  .btn-secondary:hover { background: #cbd5e1; }
  .copy-btn { margin-right: 10px; }
  .prompt-area {
    background: #fef9e7;
    border: 1px solid #f59e0b;
    border-radius: 12px;
    padding: 16px;
    margin: 16px 0;
    white-space: pre-wrap;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.6;
    max-height: 400px;
    overflow-y: auto;
  }
  .badge {
    display: inline-block;
    background: #7c3aed;
    color: #fff;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    margin-left: 8px;
  }
  .footer { margin-top: 20px; text-align: center; color: #94a3b8; font-size: 12px; }
  @media (max-width: 600px) { body { padding: 20px 10px; } .container { padding: 20px; } }
</style>
</head>
<body>
<div class="container" id="app">
  <h2 style="margin-bottom: 8px;">🤖 AI Model Answer</h2>
  <div id="questionDisplay" class="question">Loading question...</div>
  <div id="answerDisplay" class="answer-box"><span class="loading">⏳ Generating answer...</span></div>
  <div id="promptArea" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <strong>📋 Ready-to-use Prompt:</strong>
      <button class="btn btn-secondary copy-btn" onclick="copyPrompt()">📄 Copy Prompt</button>
    </div>
    <div id="promptContent" class="prompt-area"></div>
    <p style="font-size:13px; color:#475569; margin-top:8px;">
      Copy the prompt above and paste it into your chosen AI tool (Perplexity, ChatGPT, or DeepSeek) to generate the answer.
    </p>
  </div>
  <div style="display:flex; gap:10px; flex-wrap:wrap;">
    <button class="btn" id="regenerateBtn" style="display:none;">🔄 Regenerate</button>
    <button class="btn btn-secondary" onclick="window.close()">✕ Close</button>
  </div>
  <div class="footer">Powered by your AI Worker</div>
</div>

<script>
  // Parse URL parameters
  const params = new URLSearchParams(window.location.search);
  const question = decodeURIComponent(params.get('q') || '');
  const year = decodeURIComponent(params.get('y') || '');
  const marks = decodeURIComponent(params.get('m') || '');
  const model = decodeURIComponent(params.get('model') || 'secret');
  const mode = decodeURIComponent(params.get('mode') || 'internal'); // 'internal' or 'external'

  const questionDisplay = document.getElementById('questionDisplay');
  const answerDisplay = document.getElementById('answerDisplay');
  const promptArea = document.getElementById('promptArea');
  const promptContent = document.getElementById('promptContent');
  const regenerateBtn = document.getElementById('regenerateBtn');

  // Build question display
  let meta = '';
  if (year) meta += ` (${year})`;
  if (marks) meta += ` — ${marks} Marks`;
  questionDisplay.textContent = question + meta;

  // ============================================================
  // Internal mode (Worker API) – for "secret" model
  // ============================================================
  async function generateInternal() {
    const userToken = localStorage.getItem('userToken') || localStorage.getItem('qcab_owner_key');
    if (!userToken) {
      answerDisplay.innerHTML = '❌ Please login first. <a href="#" onclick="window.location.href=\'./login.html\'">Login</a>';
      return;
    }

    try {
      const res = await fetch(`https://qcap-ai-v2.khokcha9.workers.dev/api/generate-answer?question=${encodeURIComponent(question)}`, {
        headers: { 'Authorization': 'Bearer ' + userToken }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to generate');
      answerDisplay.innerHTML = data.text.replace(/\n/g, '<br>');
      regenerateBtn.style.display = 'inline-block';
    } catch (err) {
      answerDisplay.innerHTML = `❌ Error: ${err.message}`;
    }
  }

  // ============================================================
  // External mode – show a prompt for the user to copy
  // ============================================================
  function showExternalPrompt() {
    const modelName = model.charAt(0).toUpperCase() + model.slice(1);
    const prompt = `You are an expert UPSC Civil Services model answer writer. Generate a high-quality, comprehensive answer of approximately 500–600 words for the following question:

"${question}"

Instructions:
- Provide a well-structured answer with introduction, main body (with subheadings if needed), and conclusion.
- Use relevant facts, examples, and recent developments (up to ${new Date().toLocaleDateString()}).
- Write in a formal, academic style suitable for the UPSC Mains examination.
- Ensure the answer is balanced and covers all dimensions of the question.

Please generate the answer now.`;

    answerDisplay.style.display = 'none';
    promptArea.style.display = 'block';
    promptContent.textContent = prompt;
    regenerateBtn.style.display = 'none';
    // Also show a note about the model
    document.querySelector('#app h2').textContent = `🤖 ${modelName} AI – Ready Prompt`;
  }

  // ============================================================
  // Copy prompt function
  // ============================================================
  function copyPrompt() {
    const text = promptContent.textContent;
    navigator.clipboard.writeText(text).then(() => {
      alert('Prompt copied to clipboard!');
    }).catch(() => {
      // Fallback
      const textarea = document.createElement('textarea');
      textarea.value = text;
      document.body.appendChild(textarea);
      textarea.select();
      document.execCommand('copy');
      textarea.remove();
      alert('Prompt copied!');
    });
  }

  // ============================================================
  // Regenerate (internal only)
  // ============================================================
  regenerateBtn.addEventListener('click', generateInternal);

  // ============================================================
  // Start
  // ============================================================
  if (mode === 'external' || model !== 'secret') {
    showExternalPrompt();
  } else {
    // Internal – use Worker API
    generateInternal();
  }

  // Make copyPrompt global for onclick
  window.copyPrompt = copyPrompt;
</script>
</body>
</html>
