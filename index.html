<!-- EMBEDDED CONFIG & FULL APP LOGIC -->
<script>
  // ============================================================
  // 1. CONFIG (directly embedded)
  // ============================================================
  const SYLLABUS = {
    GS1: ['Art & Culture','Modern History','Post Independence','World History','Physical Geography','Economic & Human Geography','Indian society'],
    GS2: ['Polity','Governance','Social Justice','International Relations'],
    GS3: ['Economy','Agriculture','Internal Security','Environment & Disaster Management','Science & Tech'],
    GS4: ['Ethics Theory','Case Studies'],
    OPT1: [ '1.1 Meaning, Scope...' /* full list */ ],
    OPT2: [ '1.1 Evolution of Indian Culture...' /* full list */ ]
  };
  const WORKER_URL = 'https://qcap-ai-v2.khokcha9.workers.dev';
  const MARK_RULES = { 10: 2, 15: 3, 20: 4 };

  // ============================================================
  // 2. CUSTOM MODAL & TOAST SYSTEM (same as before, but compact)
  // ============================================================
  async function showAlert(msg, title='Notice') { /* ... */ }
  async function showConfirm(msg, title='Confirm') { /* ... */ }
  async function showPrompt(msg, title='Enter Value', def='') { /* ... */ }
  function showToast(msg, icon='✅') { /* ... */ }
  function copyText(text) { /* ... */ }

  // ============================================================
  // 3. AUTH FUNCTIONS (minimal)
  // ============================================================
  function getUser() { try { return JSON.parse(localStorage.getItem('qcab_user')); } catch(e){ return null; } }
  function setUser(user) { /* ... */ }
  function openLoginModal(mode) { /* ... */ }
  function closeLoginModal() { /* ... */ }
  function initAuth() { /* attach events */ }

  // ============================================================
  // 4. MAIN APP – ALL LOGIC (load, render, filters, AI, PDF, etc.)
  // ============================================================
  document.addEventListener('DOMContentLoaded', function() {
    console.log('🚀 App started (embedded)');

    // ---- DOM refs ----
    const searchInput = document.getElementById('search-input');
    const filterPaper = document.getElementById('filter-paper');
    const filterYear = document.getElementById('filter-year');
    const filterTopic = document.getElementById('filter-topic');
    const searchBtn = document.getElementById('search-bank-btn');
    const clearBtn = document.getElementById('clear-results-btn');
    const statusText = document.getElementById('bank-status-text');
    const resultsContainer = document.getElementById('bank-results-container');

    // ---- State ----
    let presetBank = []; // will hold all loaded questions

    // ---- Helpers ----
    function getYearGroup(q) {
      if (q.yearGroup && q.yearGroup !== 'Other') return q.yearGroup;
      const raw = String(q.year || '').trim();
      const m = raw.match(/\b(19\d{2}|20\d{2})\b/);
      const y = m ? Number(m[1]) : NaN;
      if (Number.isInteger(y) && y >= 2013 && y <= 2026) return String(y);
      return 'Other';
    }
    function escapeHtml(s) { return String(s).replace(/[&<>"]/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]||m; }); }
    function normalizePaperCode(p) { /* ... */ }

    // ---- Populate filter topics (based on paper) ----
    function populateFilterTopics() {
      const paper = filterPaper.value;
      let list = [];
      if (paper === 'ALL') {
        Object.values(SYLLABUS).forEach(arr => list.push(...arr));
        list = [...new Set(list)];
      } else {
        list = SYLLABUS[paper] || [];
      }
      filterTopic.innerHTML = '<option value="ALL">All Subtopics</option>';
      list.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        filterTopic.appendChild(opt);
      });
    }

    // ---- Populate year filter from loaded questions ----
    function populateFilterYears() {
      const prev = filterYear.value;
      filterYear.innerHTML = '<option value="ALL">All Years</option>';
      const years = new Set();
      presetBank.forEach(q => {
        const yg = getYearGroup(q);
        if (yg !== 'Other') years.add(yg);
      });
      for (let y = 2026; y >= 2013; y--) {
        const yr = String(y);
        if (years.has(yr)) {
          const opt = document.createElement('option');
          opt.value = yr;
          opt.textContent = yr;
          filterYear.appendChild(opt);
        }
      }
      if (presetBank.some(q => getYearGroup(q) === 'Other')) {
        const opt = document.createElement('option');
        opt.value = 'Other';
        opt.textContent = 'Other';
        filterYear.appendChild(opt);
      }
      if (prev && filterYear.querySelector(`option[value="${prev}"]`)) filterYear.value = prev;
    }

    // ---- Load JSON files ----
    async function fetchJSON(url) {
      try {
        const res = await fetch(url + '?t=' + Date.now());
        if (!res.ok) return [];
        const data = await res.json();
        return Array.isArray(data) ? data : (data.questions || data.bank || data.data || []);
      } catch(e) { return []; }
    }

    async function loadQuestions() {
      const files = ['gs1_pyq.json','gs2_pyq.json','gs3_pyq.json','gs4_pyq.json','opt1_pyq.json','opt2_pyq.json'];
      const allData = [];
      for (const f of files) {
        const items = await fetchJSON(f);
        allData.push(...items);
      }
      // Normalize
      const newQ = [];
      allData.forEach(raw => {
        const qText = (raw.question || raw.q_text || raw.text || raw.title || '').trim();
        if (!qText || qText.toLowerCase() === 'year' || qText.toLowerCase() === 'syllabus') return;
        let marks = raw.marks || raw.mark || 10;
        if (typeof marks === 'string') marks = parseInt(marks.replace(/[^0-9]/g,''),10) || 10;
        const rawYearText = String(raw.year || raw.exam_year || raw.Year || '').trim();
        const m = rawYearText.match(/\b(19\d{2}|20\d{2})\b/);
        const rawYear = m ? m[1] : 'Other';
        const yNum = rawYear === 'Other' ? NaN : Number(rawYear);
        const yearGroup = (Number.isInteger(yNum) && yNum >= 2013 && yNum <= 2026) ? String(yNum) : 'Other';
        const paper = normalizePaperCode(raw.paper || raw.gs || raw.subject || 'GS1');
        const topic = raw.topic || raw.subtopic || raw.category || SYLLABUS[paper]?.[0] || 'General';
        newQ.push({
          id: raw.id || 'q_' + Date.now() + '_' + Math.random().toString(36).substring(2,9),
          paper: paper,
          topic: String(topic).trim(),
          year: rawYearText || rawYear,
          yearGroup: yearGroup,
          marks: Number(marks),
          question: qText
        });
      });
      // Merge with custom (if any)
      presetBank = newQ; // overwrite with fresh
      // Save to localStorage for persistence (optional)
      // localStorage.setItem('qcab_preset_bank', JSON.stringify(presetBank));
      populateFilterYears();
      populateFilterTopics();
      renderBank();
      statusText.textContent = `Current Bank Size: ${presetBank.length} question(s) loaded.`;
    }

    // ---- Render Bank (both filters active) ----
    function renderBank() {
      const query = searchInput.value.toLowerCase().trim();
      const selectedP = filterPaper.value;
      const selectedY = filterYear.value;
      const selectedT = filterTopic.value;

      let filtered = presetBank.filter(q => {
        const qText = `${q.question||''} ${q.topic||''} ${q.paper||''} ${q.year||''}`.toLowerCase();
        if (query && !qText.includes(query)) return false;
        if (selectedP !== 'ALL' && q.paper !== selectedP) return false;
        if (selectedY !== 'ALL' && getYearGroup(q) !== selectedY) return false;
        if (selectedT !== 'ALL') {
          const qTopic = (q.topic||'').toLowerCase().trim();
          const sTopic = selectedT.toLowerCase().trim();
          if (!qTopic.includes(sTopic) && !sTopic.includes(qTopic)) return false;
        }
        return true;
      });

      resultsContainer.innerHTML = '';
      const total = filtered.length;
      const countMsg = document.createElement('div');
      countMsg.style.cssText = 'margin-bottom:12px; font-weight:600; color:var(--text); font-size:14px;';
      countMsg.textContent = `Showing ${total} of ${presetBank.length} question${presetBank.length>1?'s':''}`;
      resultsContainer.appendChild(countMsg);

      if (total === 0) {
        const no = document.createElement('p');
        no.style.cssText = 'font-size:13px; color:var(--muted); font-style:italic;';
        no.textContent = 'No questions found.';
        resultsContainer.appendChild(no);
        return;
      }

      filtered.forEach((q, idx) => {
        const div = document.createElement('div');
        div.className = 'bank-item';
        // paper class
        const paperClass = 'tag-paper-' + q.paper.toLowerCase();
        div.innerHTML = `
          <div class="bank-question"><strong>${idx+1}.</strong> ${escapeHtml(q.question)}</div>
          <div class="bank-bottom">
            <div class="tags">
              <span class="tag ${paperClass}">${escapeHtml(q.paper)}</span>
              <span class="tag tag-topic">${escapeHtml(q.topic)}</span>
              <span class="tag">${q.marks} M ${q.year ? '/ ' + escapeHtml(q.year) : ''}</span>
            </div>
            <div class="bank-actions" style="flex-wrap:wrap; gap:6px;">
              <button class="btn-study" data-action="bookmark" data-id="${q.id}">⭐ Bookmark</button>
              <button class="btn-study" data-action="revise" data-id="${q.id}">✅ Mark Revised</button>
              <button class="btn-study note-btn" data-action="note" data-id="${q.id}">📝 Note</button>
              <button class="btn-secondary-sm btn-add-item">+ Add</button>
              <button class="btn-secondary-sm btn-direct-pdf">⚡ PDF</button>
              <button class="btn-secondary-sm btn-ai-answer btn-ai-highlight" onclick="window.fetchAIAnswer(this)">✨ AI</button>
            </div>
          </div>
        `;
        resultsContainer.appendChild(div);
      });
    }

    // ---- Event listeners ----
    searchInput?.addEventListener('input', renderBank);
    searchBtn?.addEventListener('click', renderBank);
    filterPaper?.addEventListener('change', () => {
      populateFilterTopics();
      renderBank();
    });
    filterYear?.addEventListener('change', renderBank);
    filterTopic?.addEventListener('change', renderBank);
    clearBtn?.addEventListener('click', () => {
      searchInput.value = '';
      filterPaper.value = 'ALL';
      filterYear.value = 'ALL';
      filterTopic.value = 'ALL';
      populateFilterTopics();
      renderBank();
    });

    // ---- AI modal functions (global) ----
    window.fetchAIAnswer = function(btn) {
      const card = btn.closest('.bank-item');
      if (!card) return;
      const qEl = card.querySelector('.bank-question');
      let qText = qEl ? qEl.innerText.trim() : '';
      qText = qText.replace(/^\d+\.\s*/, '');
      const tags = card.querySelectorAll('.tag');
      let marks = '', year = '';
      tags.forEach(tag => {
        const t = tag.innerText;
        if (t.includes('M')) {
          const parts = t.split('/');
          marks = parts[0].trim();
          if (parts[1]) year = parts[1].trim();
        }
      });
      const item = { question: qText, marks, year };
      openAIModal(item);
    };

    function openAIModal(item) {
      // get modal and show it
      const modal = document.getElementById('ai-model-modal');
      if (!modal) { alert('AI modal not found'); return; }
      window._pendingQuestion = item;
      modal.classList.add('open');
    }

    // handle model selection (inside modal)
    document.querySelectorAll('.model-option')?.forEach(btn => {
      btn.addEventListener('click', function() {
        const model = this.dataset.model;
        const q = window._pendingQuestion;
        if (!q) return;
        if (model === 'secret') {
          // open answer.html with params
          const url = `answer.html?q=${encodeURIComponent(q.question)}&y=${encodeURIComponent(q.year||'')}&m=${encodeURIComponent(q.marks||'')}&model=secret`;
          window.open(url, '_blank');
        } else if (model === 'perplexity') {
          const prompt = `UPSC model answer for: "${q.question}" with introduction, body, conclusion, and recent examples.`;
          window.open(`https://www.perplexity.ai/search?q=${encodeURIComponent(prompt)}`, '_blank');
        } else {
          // chatgpt or deepseek: copy full prompt to clipboard and open site
          const fullPrompt = `You are an expert UPSC Civil Services model answer writer. Generate a high-quality answer of about 500 words for the following question with introduction, body, and conclusion. Use recent facts and examples. Question: "${q.question}"`;
          navigator.clipboard.writeText(fullPrompt).then(() => {
            const url = model === 'chatgpt' ? 'https://chat.openai.com/' : 'https://chat.deepseek.com/';
            window.open(url, '_blank');
            showToast('Prompt copied! Paste in ' + (model==='chatgpt'?'ChatGPT':'DeepSeek') + ' and press Enter.', model==='chatgpt'?'💬':'🔬');
          }).catch(() => {
            // fallback
            const ta = document.createElement('textarea');
            ta.value = fullPrompt;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            ta.remove();
            const url = model === 'chatgpt' ? 'https://chat.openai.com/' : 'https://chat.deepseek.com/';
            window.open(url, '_blank');
            showToast('Prompt copied! Paste in ' + (model==='chatgpt'?'ChatGPT':'DeepSeek') + ' and press Enter.', model==='chatgpt'?'💬':'🔬');
          });
        }
        // close modal
        document.getElementById('ai-model-modal')?.classList.remove('open');
        window._pendingQuestion = null;
      });
    });

    // close modal on backdrop and close button
    document.getElementById('ai-model-close')?.addEventListener('click', function() {
      document.getElementById('ai-model-modal')?.classList.remove('open');
    });
    document.getElementById('cancel-ai-modal')?.addEventListener('click', function() {
      document.getElementById('ai-model-modal')?.classList.remove('open');
    });
    document.getElementById('ai-model-modal')?.addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

    // ---- Initialize ----
    loadQuestions();
    // if you have other modules like login, etc., you can call them too

    console.log('✅ Embedded app ready');
  });
</script>
