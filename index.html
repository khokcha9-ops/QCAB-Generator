<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preset Quiz</title>
</head>
<body>
  <h1>Question Bank</h1>
  <div id="quiz-container">Loading questions...</div>

  <script>
    // Load the preset JSON file hosted in the same repository
    async function loadPresetQuestions() {
      try {
        const response = await fetch('./questions.json');
        
        if (!response.ok) {
          throw new Error(`Failed to load preset: ${response.statusText}`);
        }
        
        const questions = await response.json();
        renderQuestions(questions);
      } catch (error) {
        console.error("Error loading questions:", error);
        document.getElementById('quiz-container').innerText = "Failed to load questions.";
      }
    }

    // Function to display the fetched questions on the page
    function renderQuestions(data) {
      const container = document.getElementById('quiz-container');
      container.innerHTML = ''; // Clear loading text

      data.forEach((q, index) => {
        const qElement = document.createElement('div');
        qElement.className = 'question-card';
        qElement.innerHTML = `
          <h3>${index + 1}. ${q.question}</h3>
          <ul>
            ${q.options.map(option => `<li>${option}</li>`).join('')}
          </ul>
        `;
        container.appendChild(qElement);
      });
    }

    // Run automatically when the page loads
    window.addEventListener('DOMContentLoaded', loadPresetQuestions);
  </script>
</body>
</html>
