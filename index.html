<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPSC Mains PYQ cum QCAB Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
</head>
<body>
<!-- ===== SIDEBAR, TOPBAR, HERO, STATS, etc. (keep your existing) ===== -->
<!-- I'll show only the PYQ BANK section with both filters. -->

<!-- ... your existing sidebar, topbar, hero, stats ... -->

<div class="workspace">
  <!-- LEFT COLUMN -->
  <section>
    <!-- CREATE QUESTION (keep your existing) -->
    <!-- PYQ BANK (with both filters) -->
    <div class="card" id="pyq-bank">
      <div class="card-header">
        <div>
          <h2 class="card-title">PYQ Bank</h2>
          <p class="card-sub">Search by question, topic, paper or year. Results update as you type.</p>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn" id="toggle-bank-btn"><span id="toggle-bank-icon">▾</span> <span id="toggle-bank-text">Hide Bank</span></button>
          <button class="btn btn-danger" id="clear-bank-btn">Reset Bank</button>
        </div>
      </div>
      <div id="pyq-bank-body">
        <!-- NO MODE SWITCH – both filters always visible -->
        <div class="search-main">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="Search Constitution, Monsoon, Federalism, 2024...">
        </div>
        <div class="filter-box">
          <div class="filters">
            <select id="filter-paper">
              <option value="ALL">All Papers</option>
              <option value="GS1">GS Paper 1</option>
              <option value="GS2">GS Paper 2</option>
              <option value="GS3">GS Paper 3</option>
              <option value="GS4">GS Paper 4</option>
              <option value="OPT1">Anthropology Optional Paper 1</option>
              <option value="OPT2">Anthropology Optional Paper 2</option>
            </select>
            <select id="filter-year"><option value="ALL">All Years</option></select>
            <select id="filter-topic"><option value="ALL">All Subtopics</option></select>
            <button class="btn btn-primary" id="search-bank-btn">Search</button>
            <button class="btn" id="clear-results-btn">Clear</button>
          </div>
        </div>
        <div id="bank-status-text">Loading question bank...</div>
        <div id="bank-results-container"><p style="font-size:13px;color:var(--muted);font-style:italic;">Loading repository questions...</p></div>
      </div>
    </div>
  </section>
  <!-- RIGHT QCAB (keep your existing) -->
</div>

<!-- ===== MODALS (keep your existing) ===== -->

<!-- ===== SCRIPTS ===== -->
<script>
  // ============================================================
  // EMBEDDED CONFIG (no external config.js needed)
  // ============================================================
  const SYLLABUS = {
    GS1: ['Art & Culture','Modern History','Post Independence','World History','Physical Geography','Economic & Human Geography','Indian society'],
    GS2: ['Polity','Governance','Social Justice','International Relations'],
    GS3: ['Economy','Agriculture','Internal Security','Environment & Disaster Management','Science & Tech'],
    GS4: ['Ethics Theory','Case Studies'],
    OPT1: ['1.1 Meaning...','...'], // full list (I'll include in final answer)
    OPT2: ['1.1 Evolution...','...']
  };
  const WORKER_URL = 'https://qcap-ai-v2.khokcha9.workers.dev';
  const MARK_RULES = { 10: 2, 15: 3, 20: 4 };

  // ============================================================
  // CORE LOGIC (minimal, only what's needed)
  // ============================================================
  document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-input');
    const filterPaper = document.getElementById('filter-paper');
    const filterYear = document.getElementById('filter-year');
    const filterTopic = document.getElementById('filter-topic');
    const resultsContainer = document.getElementById('bank-results-container');
    const statusText = document.getElementById('bank-status-text');
    let presetBank = [];

    function getYearGroup(q) {
      if (q.yearGroup && q.yearGroup !== 'Other') return q.yearGroup;
      const raw = String(q.year || '').trim();
      const m = raw.match(/\b(19\d{2}|20\d{2})\b/);
      const y = m ? Number(m[1]) : NaN;
      if (Number.isInteger(y) && y >= 2013 && y <= 2026) return String(y);
      return 'Other';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m]);
    }

    function normalizePaper(p) {
      const s = String(p).toUpperCase().trim();
      if (s === 'GS1' || s === 'GS PAPER 1') return 'GS1';
      if (s === 'GS2' || s === 'GS PAPER 2') return 'GS2';
      if (s === 'GS3' || s === 'GS PAPER 3') return 'GS3';
      if (s === 'GS4' || s === 'GS PAPER 4') return 'GS4';
      if (s.includes('OPT1')) return 'OPT1';
      if (s.includes('OPT2')) return 'OPT2';
      return 'GS1';
    }

    function populateFilterTopics() {
      const paper = filterPaper.value;
      let list = paper === 'ALL' ? Object.values(SYLLABUS).flat() : (SYLLABUS[paper] || []);
      filterTopic.innerHTML = '<option value="ALL">All Subtopics</option>';
      [...new Set(list)].forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        filterTopic.appendChild(opt);
      });
    }

    function populateFilterYears() {
      const prev = filterYear.value;
      filterYear.innerHTML = '<option value="ALL">All Years</option>';
      const years = new Set();
      presetBank.forEach(q => {
        const yg = getYearGroup(q);
        if (yg !== 'Other') years.add(yg);
      });
      for (let y = 2026; y >= 2013; y--) {
        const yr = String(y);
        if (years.has(yr)) {
          const opt = document.createElement('option');
          opt.value = yr;
          opt.textContent = yr;
          filterYear.appendChild(opt);
        }
      }
      if (presetBank.some(q => getYearGroup(q) === 'Other')) {
        const opt = document.createElement('option');
        opt.value = 'Other';
        opt.textContent = 'Other';
        filterYear.appendChild(opt);
      }
      if (prev && filterYear.querySelector(`option[value="${prev}"]`)) filterYear.value = prev;
    }

    async function fetchJSON(url) {
      try {
        const res = await fetch(url + '?t=' + Date.now());
        if (!res.ok) return [];
        const data = await res.json();
        return Array.isArray(data) ? data : (data.questions || data.bank || data.data || []);
      } catch { return []; }
    }

    async function loadQuestions() {
      const files = ['gs1_pyq.json','gs2_pyq.json','gs3_pyq.json','gs4_pyq.json','opt1_pyq.json','opt2_pyq.json'];
      const all = [];
      for (const f of files) {
        const items = await fetchJSON(f);
        all.push(...items);
      }
      presetBank = all.map(raw => {
        const qText = (raw.question || raw.q_text || raw.text || raw.title || '').trim();
        if (!qText || qText.toLowerCase() === 'year' || qText.toLowerCase() === 'syllabus') return null;
        let marks = raw.marks || raw.mark || 10;
        if (typeof marks === 'string') marks = parseInt(marks.replace(/[^0-9]/g,''),10) || 10;
        const rawYearText = String(raw.year || raw.exam_year || raw.Year || '').trim();
        const m = rawYearText.match(/\b(19\d{2}|20\d{2})\b/);
        const rawYear = m ? m[1] : 'Other';
        const yNum = rawYear === 'Other' ? NaN : Number(rawYear);
        const yearGroup = (Number.isInteger(yNum) && yNum >= 2013 && yNum <= 2026) ? String(yNum) : 'Other';
        const paper = normalizePaper(raw.paper || raw.gs || raw.subject || 'GS1');
        const topic = raw.topic || raw.subtopic || raw.category || SYLLABUS[paper]?.[0] || 'General';
        return {
          id: raw.id || 'q_' + Date.now() + '_' + Math.random().toString(36).substring(2,9),
          paper,
          topic: String(topic).trim(),
          year: rawYearText || rawYear,
          yearGroup,
          marks: Number(marks),
          question: qText
        };
      }).filter(Boolean);
      populateFilterYears();
      populateFilterTopics();
      renderBank();
      statusText.textContent = `Current Bank Size: ${presetBank.length} question(s) loaded.`;
      document.getElementById('dashboard-bank-count').textContent = presetBank.length;
    }

    function renderBank() {
      const query = searchInput.value.toLowerCase().trim();
      const selectedP = filterPaper.value;
      const selectedY = filterYear.value;
      const selectedT = filterTopic.value;

      const filtered = presetBank.filter(q => {
        const qText = `${q.question||''} ${q.topic||''} ${q.paper||''} ${q.year||''}`.toLowerCase();
        if (query && !qText.includes(query)) return false;
        if (selectedP !== 'ALL' && q.paper !== selectedP) return false;
        if (selectedY !== 'ALL' && getYearGroup(q) !== selectedY) return false;
        if (selectedT !== 'ALL') {
          const qTopic = (q.topic||'').toLowerCase().trim();
          const sTopic = selectedT.toLowerCase().trim();
          if (!qTopic.includes(sTopic) && !sTopic.includes(qTopic)) return false;
        }
        return true;
      });

      resultsContainer.innerHTML = '';
      if (presetBank.length === 0) {
        resultsContainer.innerHTML = '<p style="font-size:13px;color:var(--muted);font-style:italic;">No questions loaded. Check JSON files.</p>';
        return;
      }

      const total = filtered.length;
      const countMsg = document.createElement('div');
      countMsg.style.cssText = 'margin-bottom:12px; font-weight:600; color:var(--text); font-size:14px;';
      countMsg.textContent = `Showing ${total} of ${presetBank.length} question${presetBank.length>1?'s':''}`;
      resultsContainer.appendChild(countMsg);

      if (total === 0) {
        const no = document.createElement('p');
        no.style.cssText = 'font-size:13px; color:var(--muted); font-style:italic;';
        no.textContent = 'No questions found matching these filters.';
        resultsContainer.appendChild(no);
        return;
      }

      filtered.forEach((q, idx) => {
        const div = document.createElement('div');
        div.className = 'bank-item';
        const paperClass = 'tag-paper-' + q.paper.toLowerCase();
        div.innerHTML = `
          <div class="bank-question"><strong>${idx+1}.</strong> ${escapeHtml(q.question)}</div>
          <div class="bank-bottom">
            <div class="tags">
              <span class="tag ${paperClass}">${escapeHtml(q.paper)}</span>
              <span class="tag tag-topic">${escapeHtml(q.topic)}</span>
              <span class="tag">${q.marks} M ${q.year ? '/ ' + escapeHtml(q.year) : ''}</span>
            </div>
            <div class="bank-actions" style="flex-wrap:wrap; gap:6px;">
              <button class="btn-study" data-action="bookmark" data-id="${q.id}">⭐ Bookmark</button>
              <button class="btn-study" data-action="revise" data-id="${q.id}">✅ Mark Revised</button>
              <button class="btn-study note-btn" data-action="note" data-id="${q.id}">📝 Note</button>
              <button class="btn-secondary-sm btn-add-item">+ Add</button>
              <button class="btn-secondary-sm btn-direct-pdf">⚡ PDF</button>
              <button class="btn-secondary-sm btn-ai-answer btn-ai-highlight" onclick="window.fetchAIAnswer(this)">✨ AI</button>
            </div>
          </div>
        `;
        resultsContainer.appendChild(div);
      });
    }

    // --- Event listeners ---
    searchInput?.addEventListener('input', renderBank);
    searchBtn?.addEventListener('click', renderBank);
    filterPaper?.addEventListener('change', () => { populateFilterTopics(); renderBank(); });
    filterYear?.addEventListener('change', renderBank);
    filterTopic?.addEventListener('change', renderBank);
    clearBtn?.addEventListener('click', () => {
      searchInput.value = '';
      filterPaper.value = 'ALL';
      filterYear.value = 'ALL';
      filterTopic.value = 'ALL';
      populateFilterTopics();
      renderBank();
    });

    // --- AI modal (minimal) ---
    window.fetchAIAnswer = function(btn) {
      const card = btn.closest('.bank-item');
      if (!card) return;
      const qEl = card.querySelector('.bank-question');
      let qText = qEl ? qEl.innerText.trim() : '';
      qText = qText.replace(/^\d+\.\s*/, '');
      const tags = card.querySelectorAll('.tag');
      let marks = '', year = '';
      tags.forEach(tag => {
        const t = tag.innerText;
        if (t.includes('M')) {
          const parts = t.split('/');
          marks = parts[0].trim();
          if (parts[1]) year = parts[1].trim();
        }
      });
      const item = { question: qText, marks, year };
      const modal = document.getElementById('ai-model-modal');
      if (modal) {
        window._pendingQuestion = item;
        modal.classList.add('open');
      } else {
        alert('AI modal not found');
      }
    };

    // --- Init ---
    loadQuestions();
    // (Also call your auth init if you have it)
    if (typeof initAuth === 'function') initAuth();
  });
</script>
</body>
</html>
