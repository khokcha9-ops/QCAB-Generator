<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - QCAB</title>
    <style>
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex; justify-content: center; align-items: center; height: 100vh;
        }
        .card {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
            padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            width: 90%; max-width: 400px;
        }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        button { width: 100%; padding: 15px; border: none; border-radius: 10px; background: #667eea; color: white; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #5a67d8; }
        .switch { text-align: center; color: #667eea; cursor: pointer; font-weight: 600; margin-top: 10px; }
        h2 { color: #333; text-align: center; margin-bottom: 20px; }
        .hidden { display: none; }
        #modal-error { color: red; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="formTitle">Login</h2>
        <input type="text" id="name" placeholder="Your Name" class="hidden">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button id="submitBtn" onclick="handleAuth()">Login</button>
        <p class="switch" onclick="toggleMode()">Don't have an account? Register</p>
        <p id="modal-error"></p>
    </div>
    <script>
        const WORKER_URL = 'https://qcap-ai-v2.khokcha9.workers.dev';
        let isRegister = false;
        function toggleMode() { 
            isRegister = !isRegister; 
            document.getElementById('name').classList.toggle('hidden');
            document.getElementById('formTitle').innerText = isRegister ? 'Register' : 'Login';
            document.getElementById('submitBtn').innerText = isRegister ? 'Register' : 'Login';
        }
        async function handleAuth() {
            const name = document.getElementById('name').value; const email = document.getElementById('email').value; const password = document.getElementById('password').value;
            const endpoint = isRegister ? '/api/register' : '/api/login'; const payload = isRegister ? { name, email, password } : { email, password };
            const res = await fetch(WORKER_URL + endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
            const data = await res.json();
            if (res.ok) {
                if (data.token) {
                    localStorage.setItem('userToken', data.token);
                    window.location.href = './index.html';
                } else { alert('Registration successful, please login'); toggleMode(); }
            } else { document.getElementById('modal-error').innerText = data.error || 'Authentication failed'; }
        }
    </script>
</body>
</html>
