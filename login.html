<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - QCAB</title>
    
    <!-- Add marked.js (just in case it's needed later) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; background-color: #f4f7fc; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .switch { text-align: center; margin-top: 15px; cursor: pointer; color: #007bff; }
        .hidden { display: none; }
        .auth-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-top: 50px; }
    </style>
</head>
<body>

    <div class="auth-box">
        <div id="auth-section">
            <h2 id="formTitle" style="margin-top:0;">Login</h2>

            <!-- Name field is hidden by default -->
            <input type="text" id="name" placeholder="Your Name" class="hidden">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="submitBtn" onclick="handleAuth()">Login</button>
            
            <div class="switch" onclick="toggleMode()">Don't have an account? Register</div>
        </div>
    </div>

    <script>
        // ⚠️ REPLACE THIS URL WITH YOUR ACTUAL WORKER URL
        const BASE_URL = 'https://qcap-ai-v2.khokcha9.workers.dev'; 
        let isRegister = false;

        // Check for a redirect URL (e.g., index.html/?redirect=answer.html?q=...)
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect');

        // Check if user is already logged in when page loads
        window.onload = function() {
            const token = localStorage.getItem('userToken');
            if (token) {
                // If logged in and there was a specific question, go straight to it
                if (redirectUrl) {
                    window.location.href = redirectUrl;
                } else {
                    window.location.href = "./answer.html";
                }
            }
        };

        function toggleMode() {
            isRegister = !isRegister;
            const nameInput = document.getElementById('name');
            const title = document.getElementById('formTitle');
            const button = document.getElementById('submitBtn');

            if (isRegister) {
                nameInput.classList.remove('hidden');
                title.innerText = 'Register';
                button.innerText = 'Register';
            } else {
                nameInput.classList.add('hidden');
                title.innerText = 'Login';
                button.innerText = 'Login';
            }
        }

        async function handleAuth() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const endpoint = isRegister ? '/api/register' : '/api/login';
            const bodyData = { email, password };
            if (isRegister) bodyData.name = name;

            const res = await fetch(BASE_URL + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });
            
            const data = await res.json();

            if (res.ok) {
                if (isRegister) {
                    alert('Registration successful! Please login.');
                    toggleMode(); // Switch to Login mode
                } else {
                    // Save token and name to localStorage
                    localStorage.setItem('userToken', data.token);
                    localStorage.setItem('userName', data.name || email);
                    
                    // Redirect to the question they clicked, or to answer.html
                    if (redirectUrl) {
                        window.location.href = redirectUrl;
                    } else {
                        window.location.href = "./answer.html";
                    }
                }
            } else {
                alert('Error: ' + data.error);
            }
        }
    </script>
</body>
</html>
