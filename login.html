<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - QCAB</title>
    
    <!-- Add marked.js to convert Markdown to HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: 0 auto; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        .switch { text-align: center; margin-top: 15px; cursor: pointer; color: #007bff; }
        .hidden { display: none; }
        /* Styling for the HTML tags sent by the AI */
        .kw-term { color: blue; font-weight: bold; }
        .kw-example { font-style: italic; }
        .kw-meta { color: green; }
        mark.kw-highlight { background-color: yellow; }
        table { border-collapse: collapse; width: 100%; margin: 10px 0; }
        table, th, td { border: 1px solid black; padding: 8px; text-align: left; }
    </style>
</head>
<body>

    <div id="auth-section">
        <h2 id="formTitle">Login</h2>

        <!-- Name field is hidden by default -->
        <input type="text" id="name" placeholder="Your Name" class="hidden">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button id="submitBtn" onclick="handleAuth()">Login</button>
        
        <div class="switch" onclick="toggleMode()">Don't have an account? Register</div>
    </div>

    <div id="generator-section" class="hidden">
        <h2>Welcome, <span id="user-name-display"></span>!</h2>
        <textarea id="question" rows="4" placeholder="Ask a question..."></textarea>
        <button onclick="generate()">Generate Answer</button>
        <div id="result"></div>
        <button onclick="logout()" style="background-color: #dc3545; margin-top: 20px;">Logout</button>
    </div>

    <script>
        // ⚠️ REPLACE THIS URL WITH YOUR ACTUAL WORKER URL
        const BASE_URL = 'https://qcap-ai-v2.khokcha9.workers.dev'; 
        let isRegister = false;

        // Check if user is already logged in when page loads
        window.onload = function() {
            const token = localStorage.getItem('userToken');
            const name = localStorage.getItem('userName');
            if (token) {
                showGenerator(name);
            }
        };

        function toggleMode() {
            isRegister = !isRegister;
            const nameInput = document.getElementById('name');
            const title = document.getElementById('formTitle');
            const button = document.getElementById('submitBtn');

            if (isRegister) {
                nameInput.classList.remove('hidden');
                title.innerText = 'Register';
                button.innerText = 'Register';
            } else {
                nameInput.classList.add('hidden');
                title.innerText = 'Login';
                button.innerText = 'Login';
            }
        }

        async function handleAuth() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const endpoint = isRegister ? '/api/register' : '/api/login';
            const bodyData = { email, password };
            if (isRegister) bodyData.name = name;

            const res = await fetch(BASE_URL + endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });
            
            const data = await res.json();

            if (res.ok) {
                if (isRegister) {
                    alert('Registration successful! Please login.');
                    toggleMode(); // Switch to Login mode
                } else {
                    // Save token and name to localStorage so answer.html can use it!
                    localStorage.setItem('userToken', data.token);
                    localStorage.setItem('userName', data.name || email);
                    showGenerator(data.name || email);
                }
            } else {
                alert('Error: ' + data.error);
            }
        }

        function showGenerator(name) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('generator-section').classList.remove('hidden');
            document.getElementById('user-name-display').innerText = name;
        }

        function logout() {
            localStorage.removeItem('userToken');
            localStorage.removeItem('userName');
            window.location.reload();
        }

        async function generate() {
            const userToken = localStorage.getItem('userToken');
            if (!userToken) { alert('Please login first.'); return; }
            
            const question = document.getElementById('question').value;
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = "<p style='color: gray;'>Generating answer...</p>";
            
            const res = await fetch(`${BASE_URL}/api/generate-answer`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${userToken}`
                },
                body: JSON.stringify({ question })
            });
            
            const data = await res.json();
            
            if (data.error) {
                resultDiv.innerHTML = `<p style="color:red;">❌ ${data.error}</p>`;
            } else {
                // Use marked.parse() to convert Markdown to HTML
                resultDiv.innerHTML = marked.parse(data.text);
            }
        }
    </script>
</body>
</html>
